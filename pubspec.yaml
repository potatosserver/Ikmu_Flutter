name: ikmu_flutter
description: "i高醫 - 高雄醫學大學行動查詢系統 Flutter 跨平台應用"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  hooks_riverpod: ^2.4.9
  flutter_hooks: ^0.20.5
  go_router: ^13.2.0
  dio: ^5.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  flutter_secure_storage: ^10.0.0
  timezone: ^0.9.2
  crypto: ^3.0.3
  pointycastle: ^3.7.0
  flutter_animate: ^4.2.0
  fl_chart: ^0.65.0
  url_launcher: ^6.1.14
  package_info_plus: ^8.0.0
  device_info_plus: ^10.0.0
  connectivity_plus: ^7.0.0
  local_auth: ^2.3.0
  shared_preferences: ^2.5.0
  logger: ^2.0.2
  equatable: ^2.0.5

  # Maps - Platform specific
  maplibre: ^0.1.0          # 跨平台向量瓦片地圖 (Web/Android/iOS)
  # google_maps_flutter: ^2.9.0  # Mobile 原生地圖 (Android/iOS) - 可選替代方案

  # Firebase (可選，啟用後取消註解)
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.0
  # firebase_analytics: ^11.3.0
  # firebase_crashlytics: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^2.4.6
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  custom_lint: ^0.6.4
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: NotoSansTC
  #     fonts:
  #       - asset: assets/fonts/NotoSansTC-Regular.otf
  #       - asset: assets/fonts/NotoSansTC-Medium.otf
  #         weight: 500
  #       - asset: assets/fonts/NotoSansTC-Bold.otf
  #         weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  web: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1A73E8"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"